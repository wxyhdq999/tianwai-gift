<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="天外来物，一份等你打开的礼物。">
  <title>天外来物</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./scene.css">
  <link rel="stylesheet" href="./photos.css">
  <link rel="stylesheet" href="./puzzle.css">
  <link rel="stylesheet" href="./minimal.css">
  <link rel="stylesheet" href="./finale.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <section id="opening" class="opening" aria-label="天外来物"><div class="opening-content"><span class="opening-spark" aria-hidden="true">✦</span><p class="opening-line line-two">有一件天外来物，正在等你签收。</p><button id="enter-room">进入 →</button></div></section>
  <header class="topbar" id="app-header" hidden><a href="./" class="brand" aria-label="天外来物 首页"><span class="brand-icon">✳</span><span>天外来物</span></a><button class="back-room" id="back-room" hidden>← 工作台</button><button class="icon-button" id="help" aria-label="查看提示">?</button></header>
  <section class="room" id="room" hidden aria-label="接收室，点击物品探索"><div class="room-scene"><div class="room-window" aria-hidden="true">✦</div><button class="wall-map room-object" id="wall-map" aria-label="查看墙上的航行地图"><strong>航行记录</strong><svg viewBox="0 0 220 140" aria-hidden="true"><path d="M70 52 L155 28 L38 101 L126 15 L162 121 L82 76" fill="none" stroke="#93cbc5" stroke-width="1" stroke-dasharray="3 5"/><g fill="#e7b56c"><circle cx="70" cy="52" r="3"/><circle cx="155" cy="28" r="3"/><circle cx="38" cy="101" r="3"/><circle cx="126" cy="15" r="3"/><circle cx="162" cy="121" r="3"/><circle cx="82" cy="76" r="3"/></g></svg></button><div class="wall-scrap" aria-hidden="true">11 / 02<br></div><div class="desk-surface" aria-hidden="true"></div><div class="desk-front" aria-hidden="true"></div><div class="desk-lamp" aria-hidden="true"><i></i></div><button class="desk-radio room-object" id="room-radio" aria-label="查看桌上的收音机"><span class="radio-antenna"></span><span class="radio-display">11.02 <small>MHz</small></span><span class="radio-speaker"></span><span class="radio-knob"></span></button><button class="desk-notebook room-object" id="room-notebook" aria-label="翻开桌上的本子"><strong>手记</strong><span>✳</span></button><button class="desk-package room-object" id="room-package" aria-label="查看桌上的包裹"><span class="package-tape"></span><span class="package-sticker"><strong>待签收</strong></span></button><div class="desk-pencil" aria-hidden="true"></div></div><div class="search-task"><label for="search-record">碎片</label><select id="search-record"></select><p id="search-status"></p></div></section>

  <main id="terminal" hidden>
    <section class="map-panel panel" aria-labelledby="map-title"><div class="panel-head"><h2 id="map-title">航行记录</h2><span class="progress-count"><span id="found-count">0</span> / <span class="count-total">9</span></span></div>
      <div class="map-canvas" id="map"><svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="52" cy="52" rx="42" ry="41" class="radar-ring"/><ellipse cx="52" cy="52" rx="27" ry="27" class="radar-ring"/><path class="route-base"/><path class="route-lit" id="route-lit"/></svg><div id="city-points"></div></div>
    </section>
    <div class="map-actions"><button id="archive-button" aria-label="查看相册">相册 <span id="ticket-caption"></span> ↗</button><button id="note-button" aria-label="查看地图提示">?</button></div>
    <div class="journey-entry" id="journey-entry" hidden><button class="primary" id="arrange-journey">整理航线 →</button><button id="replay-journey" hidden>重播航线</button><button id="read-birthday" hidden>11月2日 · 打开信封</button></div><footer><button id="reset">重新开始</button></footer>
  </main>
  <section id="flight-scene" class="flight-scene" hidden aria-labelledby="flight-title"><div class="flight-heading"><button id="leave-flight">← 地图</button><h2 id="flight-title">把现场，连起来。</h2><span id="flight-progress" aria-live="polite"></span></div><div id="flight-map" class="flight-map"><svg id="flight-routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div id="flight-stops"></div><button id="paper-plane" class="paper-plane" aria-label="打开生日信" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M3 20 44 4 29 45 21 28Z" fill="#e8dfc9"/><path d="M21 28 44 4 16 23" fill="#b6c7bb"/><path d="m21 28 2 10 6-7" fill="#7a9a90"/></svg></button></div><p id="flight-caption" role="status"></p><div class="flight-controls"><button id="skip-flight">跳过动画</button><button id="replay-flight" hidden>重播</button><button class="envelope-button" id="flight-envelope" hidden><span class="envelope-art" aria-hidden="true"></span><span>11月2日 · 拆开</span></button></div></section>
  <dialog id="sort-dialog" class="sort-dialog" aria-labelledby="sort-title"><button class="close" data-close aria-label="关闭排序">×</button><h2 id="sort-title">整理航线</h2><p>从最早的一场开始。点两张，交换位置。</p><div id="sort-cards" class="sort-cards"></div><p id="sort-feedback" role="status"></p><button class="primary" id="confirm-route">确认顺序</button></dialog>
  <dialog id="birthday-dialog" class="birthday-dialog" aria-labelledby="birthday-title"><button class="close" data-close aria-label="关闭生日信">×</button><p id="birthday-date"></p><span class="letter-star" aria-hidden="true">✦</span><h2 id="birthday-title"></h2><div id="birthday-message"></div><button id="letter-album">回首页拆包裹 ↗</button></dialog>
  <dialog id="gift-dialog" class="gift-dialog" aria-label="生日包裹"><button class="close" data-close aria-label="关闭包裹">×</button><div id="sealed-gift"><div class="unwrap-box" aria-hidden="true"><i></i><span>11 / 02</span></div><button id="unwrap-gift" class="primary">拆开</button></div><div id="gift-content" hidden><div id="gift-placeholder" class="gift-placeholder" aria-label="礼物图片预留位置">✦</div><img id="gift-photo" alt="送给你的生日礼物" hidden><p id="gift-image-error" hidden>照片暂时没能打开，请稍后重试。</p><p id="gift-caption"></p></div></dialog>
  <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-title">
    <button class="close" data-close aria-label="关闭票根">×</button>
    <div class="record-stub"><span>照片</span><span id="record-number"></span></div>
    <div class="record-body"><p class="eyebrow" id="record-en" hidden></p><h2 id="record-title"></h2><p class="record-date" id="record-date"></p><div class="photo-flipper" id="photo-flipper"><div class="photo-turner"><div class="photo-face photo-obverse" id="photo-obverse"><div class="puzzle-board" id="puzzle-board"><img id="front-photo" alt=""><div id="puzzle-grid" class="puzzle-grid" role="group" aria-label="四块照片拼图"></div></div><p class="photo-loading" id="front-loading" hidden role="status">照片加载中…</p><p class="photo-error" id="front-error" hidden>照片加载失败，请重试。</p></div><div class="photo-face photo-reverse" id="photo-reverse" aria-hidden="true"><img id="back-photo" alt=""><p class="photo-loading" id="back-loading" hidden role="status">照片加载中…</p><p class="photo-error" id="back-error" hidden>照片加载失败，请重试。</p></div></div></div><div class="puzzle-tools" id="puzzle-tools"><p id="puzzle-status" role="status"></p><button id="search-pieces" type="button">回工作台</button><button id="open-piece-picker" type="button">便签</button><div id="piece-picker" hidden><div class="picker-head"><span id="picker-heading">本站碎片</span><button id="toggle-piece-filter">显示全部</button></div><div id="piece-options" class="piece-options"></div></div></div><form id="unlock-form" class="unlock-form" hidden><label id="gate-question" for="unlock-answer"></label><div class="unlock-input-row"><input id="unlock-answer" autocomplete="off" maxlength="60" required><button class="primary" type="submit">确认</button></div><div class="unlock-hint-row"><button type="button" id="gate-hint">提示</button><p id="gate-feedback" role="status"></p></div></form><div class="record-front" id="record-front"><span id="photo-side-label" hidden>正面 · 照片</span><button id="flip-ticket" aria-label="翻转照片" aria-pressed="false">翻到背面 ↻</button></div><div class="record-back" id="record-back" hidden><p id="back-caption" hidden></p><p id="fragment-copy" role="status"></p><button class="primary" id="collect">收录</button><button class="primary" id="next-journey" hidden>整理航线 →</button></div></div>
    <div class="record-pagination"><button id="prev-record" aria-label="上一场">←</button><span id="record-pagination"></span><button id="next-record" aria-label="下一场">→</button></div>
  </dialog>


  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><button class="close" data-close aria-label="关闭">×</button><h2 id="info-title"></h2><div id="info-content"></div><button class="primary" data-close>关闭</button></dialog>
  <dialog id="archive-dialog" class="archive-dialog" aria-labelledby="archive-title"><button class="close" data-close aria-label="关闭相册">×</button><h2 id="archive-title">相册</h2><p id="archive-description"></p><div id="archive-list"></div></dialog>
  <button id="piece-tray" class="piece-tray" hidden aria-label="打开碎片便签"><span>✳</span> 便签 <small id="tray-count">0 / 4</small></button>
  <dialog id="inventory-dialog" class="info-dialog" aria-labelledby="inventory-title"><button class="close" data-close aria-label="关闭便签">×</button><h2 id="inventory-title">便签</h2><p id="inventory-summary"></p><div id="inventory-pieces" class="piece-options"></div><button id="inventory-map" class="primary">去地图 ↗</button></dialog>
  <div class="toast" id="toast" role="status"></div><script type="module" src="./app.mjs"></script>
</body>
</html>
